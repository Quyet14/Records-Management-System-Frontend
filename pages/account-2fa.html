<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Xác thực 2 lớp</title><link rel="stylesheet" href="../assets/css/style.css?v=smooth-nav-25" /><link rel="stylesheet" href="../assets/css/auth-pages.css?v=3" /><style>.muted{color:var(--gray-600);font-size:.9rem}.setup{display:none;text-align:center;margin-top:24px}.setup img{width:220px;height:220px;object-fit:contain;margin:12px auto}.secret{font-family:'IBM Plex Mono',monospace;word-break:break-all;background:var(--gray-50);padding:10px;border-radius:var(--radius)}.error{display:none;color:var(--stamp-deny);background:rgba(163,59,59,.1);padding:10px;border-radius:var(--radius);margin:16px 0;font-size:.85rem}</style></head>
<body class="auth-page"><main class="auth-wrap"><section class="auth-art"><img class="auth-stamp" src="../assets/images/logo.png" alt="Logo Bệnh viện Hữu Nghị" /><h1>BỆNH VIỆN HỮU NGHỊ<br>Hệ thống lưu trữ tài liệu</h1><p>Vietnam-HuuNghi Hospital<br>Document Archive System</p><div class="auth-lines"><div class="auth-line"></div><div class="auth-line"></div><div class="auth-line"></div></div></section><section class="auth-panel"><h2>Xác thực 2 lớp</h2><p class="sub">Bảo vệ tài khoản bằng ứng dụng Authenticator.</p><div class="error" id="error"></div><button class="btn btn-primary auth-btn" id="setup-btn" type="button" style="display:none">Bật xác thực 2 lớp qua app</button><button class="btn btn-ghost auth-btn" id="disable-btn" type="button" style="display:none">Tắt</button><section class="setup" id="setup" style="display:none"><p>Quét mã QR bằng ứng dụng Authenticator, hoặc nhập khóa thủ công:</p><img id="qr" alt="Mã QR thiết lập TOTP" /><div class="secret" id="secret"></div><form id="form"><div class="form-group" style="text-align:left;margin-top:20px"><label class="form-label">Mã xác nhận</label><input class="form-control" id="code" maxlength="6" inputmode="numeric" required /></div><button class="btn btn-primary auth-btn" type="submit">Xác nhận bật 2 lớp</button></form></section></section></main>
<script src="../assets/js/app.js?v=stable-shell-27"></script><script src="../assets/js/auth-flow.js"></script><script>Auth.require();const error=document.getElementById('error'),setup=document.getElementById('setup');document.getElementById('setup-btn').addEventListener('click',async()=>{try{const res=await api.post('/auth/2fa/totp/setup',{});document.getElementById('qr').src=res.qr_code?.startsWith('data:')?res.qr_code:`data:image/png;base64,${res.qr_code}`;document.getElementById('secret').textContent=res.secret||'';setup.style.display='block';document.getElementById('setup-btn').style.display='none';}catch(err){error.textContent=authErrorMessage(err);error.style.display='block';}});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();try{await api.post('/auth/2fa/totp/confirm',{code:document.getElementById('code').value,totp:document.getElementById('code').value});alert('Đã bật xác thực 2 lớp.');setup.style.display='none';document.getElementById('disable-btn').style.display='inline-block';}catch(err){error.textContent=authErrorMessage(err);error.style.display='block';}});document.getElementById('disable-btn').addEventListener('click',async()=>{try{await api.del('/auth/2fa');alert('Đã tắt xác thực 2 lớp.');document.getElementById('disable-btn').style.display='none';}catch(err){error.textContent=authErrorMessage(err);error.style.display='block';}});</script></body></html>
