<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Quên mật khẩu</title><link rel="stylesheet" href="../assets/css/style.css?v=smooth-nav-25" /><link rel="stylesheet" href="../assets/css/auth-pages.css?v=4" /></head>
<body class="auth-page"><main class="auth-wrap"><section class="auth-art"><img class="auth-stamp" src="../assets/images/logo.png" alt="Logo Bệnh viện Hữu Nghị" /><h1>BỆNH VIỆN HỮU NGHỊ<br>Hệ thống lưu trữ tài liệu</h1><p>Vietnam-HuuNghi Hospital<br>Document Archive System</p><div class="auth-lines"><div class="auth-line"></div><div class="auth-line"></div><div class="auth-line"></div></div></section><section class="auth-panel"><img class="auth-panel-logo" src="../assets/images/logo.png" width="88" height="88" alt="Logo Bệnh viện Hữu Nghị" /><h2>Quên mật khẩu</h2><p class="sub">Nhập email để nhận mã xác thực đặt lại mật khẩu.</p><div class="auth-error" id="error"></div><form id="form"><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" required autocomplete="email" /></div><button class="btn btn-primary auth-btn" id="submit" type="submit">Gửi mã OTP</button></form><a class="auth-link" href="login.html">Quay lại đăng nhập</a></section></main>
<script src="../assets/js/app.js?v=stable-shell-27"></script><script src="../assets/js/auth-flow.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),x=document.getElementById('error');x.style.display='none';b.disabled=true;b.classList.add('loading');try{const email=document.getElementById('email').value.trim();await api.post('/auth/forgot-password',{email});sessionStorage.setItem('lths_reset_email',email);location.href='reset-otp.html';}catch(err){x.textContent=authErrorMessage(err);x.style.display='block';b.disabled=false;b.classList.remove('loading');}});</script></body></html>
