<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đổi mật khẩu bắt buộc</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=smooth-nav-25" />
  <link rel="stylesheet" href="../assets/css/auth-pages.css?v=3" />
  <style>.step{display:none}.step.active{display:block}.code{font:700 1.6rem 'IBM Plex Mono',monospace;text-align:center;letter-spacing:.35em}.confirmation{background:rgba(13,71,161,.08);border:1px solid rgba(13,71,161,.2);color:var(--navy);border-radius:var(--radius);padding:16px;line-height:1.5}</style>
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-art"><img class="auth-stamp" src="../assets/images/logo.png" alt="Logo Bệnh viện Hữu Nghị" /><h1>BỆNH VIỆN HỮU NGHỊ<br>Hệ thống lưu trữ tài liệu</h1><p>Vietnam-HuuNghi Hospital<br>Document Archive System</p><div class="auth-lines"><div class="auth-line"></div><div class="auth-line"></div><div class="auth-line"></div></div></section>
    <section class="auth-panel">
    <h1 id="title">Đổi mật khẩu</h1>
    <p id="subtitle">Vui lòng tạo mật khẩu mới trước khi tiếp tục.</p>
    <div class="auth-error" id="error"></div>
    <form id="password-step" class="step active">
      <div class="form-group"><label class="form-label" for="new-password">Mật khẩu mới</label><input class="form-control" id="new-password" type="password" minlength="6" required autocomplete="new-password" /></div>
      <div class="form-group"><label class="form-label" for="confirm-password">Xác nhận mật khẩu</label><input class="form-control" id="confirm-password" type="password" minlength="6" required autocomplete="new-password" /></div>
      <button class="btn btn-primary" id="password-submit" type="submit" style="width:100%;justify-content:center">Đổi mật khẩu</button>
    </form>
    <form id="otp-step" class="step">
      <p>Mã OTP đã được gửi đến <strong id="email-hint">email của bạn</strong>.</p>
      <input class="form-control code" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required />
      <button class="btn btn-primary" id="otp-submit" type="submit" style="width:100%;justify-content:center;margin-top:20px">Xác thực OTP</button>
    </form>
    <a id="back-login" href="login.html" style="display:block;margin-top:18px;color:var(--navy)">Quay lại đăng nhập</a>
    </section>
  </main>
  <script src="../assets/js/app.js?v=fast-loading-24"></script><script src="../assets/js/auth-flow.js"></script>
  <script>
    const passwordStep = document.getElementById('password-step');
    const otpStep = document.getElementById('otp-step');
    const error = document.getElementById('error');
    let userId = sessionStorage.getItem('lths_user_id') || sessionStorage.getItem('lths_force_user_id');
    const initialEmailHint = sessionStorage.getItem('lths_force_email_hint') || 'email của bạn';
    function showStep(step, title, subtitle) {
      [passwordStep, otpStep].forEach(item => item.classList.remove('active'));
      step.classList.add('active');
      document.getElementById('title').textContent = title;
      document.getElementById('subtitle').textContent = subtitle;
    }

    function showError(message) {
      error.textContent = message;
      error.style.display = 'block';
    }

    passwordStep.addEventListener('submit', async event => {
      event.preventDefault();
      const newPassword = document.querySelector('#new-password').value;
      const confirmPassword = document.querySelector('#confirm-password').value;
      const button = document.getElementById('password-submit');
      error.style.display = 'none';
      if (newPassword.length < 6 || newPassword !== confirmPassword) { error.textContent = newPassword !== confirmPassword ? 'Mật khẩu xác nhận không khớp.' : 'Mật khẩu tối thiểu 6 ký tự.'; error.style.display = 'block'; return; }
      button.disabled = true; button.classList.add('loading');
      try {
        const res = await api.post('/auth/force-change-password', {
          user_id: sessionStorage.getItem('lths_user_id') || userId,
          new_password: newPassword,
          confirm_password: confirmPassword
        });
        if (res.requires_otp === true) {
          userId = res.user_id || userId;
          document.getElementById('email-hint').textContent = res.email_hint || initialEmailHint;
          showStep(otpStep, 'Nhập mã OTP', 'Nhập mã OTP để xác nhận mật khẩu mới.');
        } else {
          const forceEmail = sessionStorage.getItem('lths_force_email');
          if (forceEmail) localStorage.removeItem(`lths_new_account_${forceEmail}`);
          await authRouteAfterStep(res, res.user_id || userId);
        }
      } catch (err) { showError(authErrorMessage(err)); button.disabled = false; button.classList.remove('loading'); }
    });

    otpStep.addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('otp-submit');
      error.style.display = 'none';
      button.disabled = true; button.classList.add('loading');
      try {
        const res = await api.post('/auth/verify-otp', { user_id: userId, otp: document.getElementById('otp').value });
        await authRouteAfterStep(res, res.user_id || userId);
      } catch (err) { showError(authErrorMessage(err, 'Mã OTP không đúng hoặc đã hết hạn.')); button.disabled = false; button.classList.remove('loading'); }
    });
  </script>
</body>
</html>
