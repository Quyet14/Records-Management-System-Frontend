<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tìm kiếm toàn hệ thống — BV Hữu Nghị</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=ready-navigation-29" />
  <!-- Dark mode: áp dụng theme trước khi render để tránh flash -->
  <script>
    (function(){
      if(localStorage.getItem('lths_dark')==='1')
        document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>
  <script src="../../assets/js/navigation-shell.js?v=ready-navigation-29"></script>
</head>
<body>
<div class="app-shell">

  <!-- Sidebar Admin -->
  <nav class="sidebar"></nav>

  <!-- Main -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main class="main-content">
    <div class="page-header page-header-row">
      <div class="page-header">
      <h1>BỆNH VIỆN HỮU NGHỊ</h1>
      <p style="color:var(--brass);font-weight:600;margin-bottom:12px">Vietnam-HuuNghi Hospital</p>
      <p style="font-size:.9rem;color:var(--gray-600);font-weight:500">Tổng quan hệ thống — Thống kê tài khoản và tài liệu toàn bộ hệ thống.</p>
    </div>
      <button class="btn btn-approve" id="btn-export">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Xuất Excel
      </button>
    </div>

    <!-- Search bar -->
    <section class="document-search-card" aria-label="Tìm kiếm tài liệu">
      <div class="document-search-toolbar document-search-toolbar-department">
        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="form-control" type="search" id="kw-input" aria-label="Từ khóa tìm kiếm" placeholder="Tìm tiêu đề, tên file, nội dung…" />
        </div>
        <select class="form-control" id="dept-filter" aria-label="Lọc theo khoa"><option value="">Tất cả khoa</option></select>
        <button class="btn btn-ghost document-search-reset" type="button" id="btn-clear-advanced-search">Xóa lọc</button>
      </div>
      <details class="document-search-filters">
        <summary><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--white)"/><circle cx="15" cy="17" r="3" fill="var(--white)"/></svg><span>Bộ lọc nâng cao</span><svg class="document-search-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
        <div class="advanced-search-panel">
          <div class="advanced-search-field">
            <label class="form-label" for="adv-reference-no">Số ký hiệu</label>
            <input class="form-control" type="text" id="adv-reference-no" placeholder="VD: 581" autocomplete="off" />
          </div>
          <div class="advanced-search-field">
            <label class="form-label" for="adv-document-number">Số văn bản</label>
            <input class="form-control" type="text" id="adv-document-number" placeholder="VD: 123" autocomplete="off" />
          </div>
          <div class="advanced-search-field">
            <label class="form-label" for="adv-issuing-unit">Đơn vị ban hành</label>
            <input class="form-control" type="text" id="adv-issuing-unit" placeholder="Tên đơn vị" autocomplete="off" />
          </div>
          <div class="advanced-search-field">
            <label class="form-label" for="adv-author-name">Người soạn thảo</label>
            <input class="form-control" type="text" id="adv-author-name" placeholder="Họ và tên" autocomplete="off" />
          </div>
          <div class="advanced-search-field">
            <label class="form-label" for="adv-received-date">Ngày đến</label>
            <input class="form-control" type="date" id="adv-received-date" />
          </div>
          <div class="advanced-search-field">
            <label class="form-label" for="adv-issued-date">Ngày hình thành</label>
            <input class="form-control" type="date" id="adv-issued-date" />
          </div>
          <div class="advanced-search-field document-search-field-wide">
            <label class="form-label" for="adv-summary">Trích yếu / mô tả</label>
            <input class="form-control" type="text" id="adv-summary" placeholder="Nhập nội dung cần tìm…" autocomplete="off" />
          </div>
        </div>
      </details>
    </section>

    <!-- Status tabs -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px">
      <button class="filter-tab active" data-status="" style="transition:all 0.2s ease;border-radius:24px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;flex-shrink:0"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18M3 15h18M15 3v18"/></svg>
        <span>Tất cả</span>
        <span class="badge" id="tab-count-all" style="margin-left:8px">0</span>
      </button>
      <button class="filter-tab" data-status="pending" style="transition:all 0.2s ease;border-radius:24px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;flex-shrink:0"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Chờ duyệt</span>
        <span class="badge" id="tab-count-pending" style="margin-left:8px;background:rgba(255,193,7,.15);color:#f59e0b">0</span>
      </button>
      <button class="filter-tab" data-status="stored" style="transition:all 0.2s ease;border-radius:24px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>
        <span>Lưu trữ</span>
        <span class="badge" id="tab-count-stored" style="margin-left:8px;background:rgba(34,197,94,.15);color:#22c55e">0</span>
      </button>
      <button class="filter-tab" data-status="rejected" style="transition:all 0.2s ease;border-radius:24px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Từ chối</span>
        <span class="badge" id="tab-count-rejected" style="margin-left:8px;background:rgba(239,68,68,.15);color:#ef4444">0</span>
      </button>
    </div>

    <div id="result-count" style="font-size:.82rem;color:var(--gray-600);margin-bottom:12px"></div>

    <div class="table-wrap" id="results-table" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Tài liệu</th>
            <th>Người gửi</th>
            <th>Khoa</th>
            <th>Ngày gửi</th>
            <th>Kích thước</th>
            <th>Trạng thái</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>

    <div id="empty-search" class="empty-state" style="min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <h3>Không tìm thấy tài liệu</h3>
      <p>Thử từ khoá khác hoặc chọn tab khác.</p>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal" style="max-width:600px">
    <button class="modal-close" data-modal-close="modal-detail">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="modal-detail-content"></div>
  </div>
</div>

<!-- Modal: Gán lại khoa -->
<div class="modal-overlay" id="modal-assign-dept">
  <div class="modal" style="max-width:420px">
    <button class="modal-close" data-modal-close="modal-assign-dept">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 class="modal-title">Gán lại khoa</h3>
    <p class="modal-subtitle" id="assign-doc-name"></p>
    <p style="font-size:.8rem;color:var(--brass);margin-bottom:16px" id="assign-dept-current"></p>
    <div class="form-group">
      <label class="form-label">Khoa mới *</label>
      <select class="form-control" id="assign-dept-select">
        <option value="">— Chọn khoa —</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-modal-close="modal-assign-dept">Huỷ</button>
      <button class="btn btn-primary" id="btn-confirm-assign">Xác nhận gán khoa</button>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="../../assets/js/app.js?v=ready-navigation-29"></script>
<script src="../../assets/js/sidebar.js?v=ready-navigation-29"></script>
<script>
  Auth.requireAdmin();


  /* esc() — see app.js */

  let page = 1;
  const limit = 20;

  /* ── Load departments & document types ────────────────────────*/
  function loadDepartments() {
    api.get('/departments?limit=10000').then(res => {
      const depts = Array.isArray(res) ? res : (res.data || []);
      // Populate filter dropdown
      const filterSel = document.getElementById('dept-filter');
      depts.forEach(d => {
        const o = document.createElement('option');
        o.value = d.id; o.textContent = d.name;
        filterSel.appendChild(o);
      });
      // Populate assign modal dropdown
      const assignSel = document.getElementById('assign-dept-select');
      depts.forEach(d => {
        const o = document.createElement('option');
        o.value = d.id; o.textContent = d.name;
        assignSel.appendChild(o);
      });
    }).catch(() => {});
  }

  function loadDocumentTypes() {
    api.get('/document-types').then(res => {
      const types = Array.isArray(res) ? res : (res.data || []);
      const sel = document.getElementById('assign-doctype-select');
      types.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id;
        o.textContent = t.name + (t.code ? ` [${t.code}]` : '');
        sel.appendChild(o);
      });
    }).catch(() => {});
  }

  /* ── Search ─────────────────────────────────────────────────── */
  let _allDocs = []; // Cache all docs for client-side filtering
  let _activeStatus = ''; // Current active tab
  let _currentDocs = []; // Currently displayed docs (after filtering)

  async function loadAll() {
    try {
      const res = await api.get('/documents/search?limit=10000'); // Load all
      _allDocs = Array.isArray(res) ? res : (res.data || res.documents || res.items || []);
      console.log('[Admin Search] Loaded docs:', _allDocs.length);
      updateTabCounts();
      renderFiltered();
    } catch (err) {
      console.error('[Admin Search] Load error:', err);
      Toast.error('Lỗi tải dữ liệu: ' + err.message);
    }
  }

  function openDocumentFromUrl() {
    const documentId = new URLSearchParams(window.location.search).get('doc');
    if (!documentId) return;
    const document = _allDocs.find(item => item.id === documentId);
    if (document) showDetail(document);
  }

  function updateTabCounts() {
    const all = _allDocs.length;
    const pending = _allDocs.filter(d => d.status === 'pending').length;
    const stored = _allDocs.filter(d => d.status === 'stored' || d.status === 'approved').length;
    const rejected = _allDocs.filter(d => d.status === 'rejected').length;
    
    document.getElementById('tab-count-all').textContent = all;
    document.getElementById('tab-count-pending').textContent = pending;
    document.getElementById('tab-count-stored').textContent = stored;
    document.getElementById('tab-count-rejected').textContent = rejected;
  }

  function normalizeText(value = '') {
    return String(value)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  function getAdvancedSearchFilters() {
    return {
      referenceNo: document.getElementById('adv-reference-no')?.value || '',
      documentNumber: document.getElementById('adv-document-number')?.value || '',
      issuingUnit: document.getElementById('adv-issuing-unit')?.value || '',
      authorName: document.getElementById('adv-author-name')?.value || '',
      summary: document.getElementById('adv-summary')?.value || ''
    };
  }

  function resetAdvancedSearch() {
    [
      'kw-input',
      'dept-filter',
      'adv-reference-no',
      'adv-document-number',
      'adv-issuing-unit',
      'adv-received-date',
      'adv-author-name',
      'adv-summary',
      'adv-issued-date'
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    renderFiltered();
  }

  const ensureSearchContent = createDocumentContentSearch(() => _allDocs, renderFiltered);

  function renderFiltered() {
    const kw = document.getElementById('kw-input').value;
    ensureSearchContent(kw + ' ' + (document.getElementById('adv-summary')?.value || ''));
    const dept = document.getElementById('dept-filter').value;
    const advancedFilters = getAdvancedSearchFilters();
    const issuedDate = document.getElementById('adv-issued-date')?.value || '';
    const receivedDate = document.getElementById('adv-received-date')?.value || '';
    
    // Check URL params for unclassified filter
    const urlParams = new URLSearchParams(window.location.search);
    const showUnclassified = urlParams.get('unclassified') === 'true';

    let filtered = _allDocs;

    // Filter by status tab
    if (_activeStatus) {
      if (_activeStatus === 'stored') {
        filtered = filtered.filter(d => d.status === 'stored' || d.status === 'approved');
      } else {
        filtered = filtered.filter(d => d.status === _activeStatus);
      }
    }

    // Filter by keyword
    if (kw) {
      filtered = filtered.filter(d => docMatchesKeyword(d, kw));
    }

    // Filter by advanced metadata fields
    filtered = filtered.filter(d => docMatchesAdvancedFields(d, advancedFilters));

    if (issuedDate) {
      filtered = filtered.filter(d => String(d.issuedDate || d.documentDate || '').slice(0, 10) === issuedDate);
    }
    if (receivedDate) {
      filtered = filtered.filter(d => String(d.receivedDate || '').slice(0, 10) === receivedDate);
    }

    // Filter by department
    if (dept) {
      filtered = filtered.filter(d => d.department?.id === dept);
    }

    // Filter unclassified
    if (showUnclassified) {
      filtered = filtered.filter(d => !d.documentType || !d.documentType.id);
      document.getElementById('kw-input').placeholder = '🔍 Đang hiển thị: Tài liệu chưa phân loại';
      document.getElementById('kw-input').style.borderColor = '#AEAE9A';
    }

    console.log('[Admin Search] Filtered:', filtered.length, 'from', _allDocs.length);
    renderResults(filtered);
  }

  /* ── Render results ─────────────────────────────────────────── */
  function renderResults(docs) {
    _currentDocs = docs;
    document.getElementById('result-count').textContent = `Hiển thị ${docs.length} tài liệu`;
    console.log('[Admin Search] Rendering:', docs.length, 'docs');

    if (!docs.length) {
      document.getElementById('results-table').style.display = 'none';
      document.getElementById('empty-search').style.display  = 'flex';
      return;
    }
    document.getElementById('empty-search').style.display  = 'none';
    document.getElementById('results-table').style.display = 'block';

    // Render bằng data-idx — không nhúng object/id vào onclick
    document.getElementById('results-body').innerHTML = docs.map((d, i) => `
      <tr data-idx="${i}" style="cursor:pointer">
        <td>
          <div style="font-weight:600;font-size:.9rem">${esc(displayDocTitle(d))}</div>
          <div class="td-mono">${esc(displayDocFilename(d))}</div>
        </td>
        <td>
          <div style="font-size:.88rem">${esc(d.uploader?.fullName || '—')}</div>
          <div class="td-mono" style="font-size:.72rem">${esc(d.uploader?.email || '')}</div>
        </td>
        <td>${esc(d.department?.name || '—')}</td>
        <td class="td-mono">${fmtDate(d.createdAt)}</td>
        <td class="td-mono">${fmtSize(d)}</td>
        <td>${statusBadge(d.status)}</td>
        <td>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" data-action="detail" data-idx="${i}">Chi tiết</button>
            <button class="btn btn-ghost btn-sm" data-action="assign-dept" data-idx="${i}"
              title="Gán lại khoa">🏛</button>
            <button class="btn btn-ghost btn-sm" data-action="assign-doctype" data-idx="${i}"
              title="Gán loại hồ sơ" style="background:${d.documentType ? 'transparent' : 'rgba(174,174,154,.1)'}">
              ${d.documentType ? '📋' : '📝'}
            </button>
            ${d.status === 'stored' && d.storagePath
              ? `<button class="btn btn-brass btn-sm" data-action="download" data-idx="${i}">↓ Tải</button>`
              : ''}
          </div>
        </td>
      </tr>`).join('');
  }

  // Event delegation — attach once tại init
  function attachTableEvents() {
    document.getElementById('results-body').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      const row = e.target.closest('tr[data-idx]');
      if (!row) return;
      const idx = parseInt(row.dataset.idx, 10);
      const d = _currentDocs[idx];
      
      if (!d) {
        console.error('[Search] Doc not found. Index:', idx, 'Array length:', _currentDocs.length);
        Toast.error('Không tìm thấy tài liệu. Vui lòng tải lại trang.');
        return;
      }

      if (btn) {
        e.stopPropagation();
        if (btn.dataset.action === 'detail')         { showDetail(d); return; }
        if (btn.dataset.action === 'assign-dept')    { openAssignDept(d); return; }
        if (btn.dataset.action === 'assign-doctype') { openAssignDoctype(d); return; }
        if (btn.dataset.action === 'download')       { downloadFile(d.id, d.originalFilename || 'document'); return; }
      }
      console.log('[Search] Preview:', d.id, d.title);
      previewFile(d.id, d.originalFilename || d.title, { doc: d });
    });
  }

  /* ── Detail modal ───────────────────────────────────────────── */
  let _detailDocId = null;

  let _detailRequest = 0;

  async function showDetail(d) {
    const request = ++_detailRequest;
    let detailUnavailable = false;
    try {
      d = await loadDocumentDetail(d);
    } catch (err) {
      detailUnavailable = true;
      console.warn('[Document details] Could not load full metadata:', err);
    }
    if (request !== _detailRequest) return;
    _detailDocId = d.id;
    const rejectReason = getRejectReason(d);
    document.getElementById('modal-detail-content').innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:20px;margin-bottom:20px">
        <div>${stampHtml(d.status)}</div>
        <div style="flex:1;min-width:0">
          <h2 class="modal-title">${esc(displayDocTitle(d))}</h2>
          <p class="modal-subtitle document-detail-subtitle">${esc(d.summary || d.description || 'Không có mô tả.')}</p>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.88rem">
        <div><span style="color:var(--gray-600)">Tên file:</span><br>
          <span class="mono">${esc(displayDocFilename(d))}</span></div>
        <div><span style="color:var(--gray-600)">Kích thước:</span><br>${fmtSize(d)}</div>
        <div><span style="color:var(--gray-600)">Người gửi:</span><br>
          ${esc(d.uploader?.fullName || '—')}<br>
          <span class="mono" style="font-size:.75rem">${esc(d.uploader?.email || '')}</span></div>
        <div><span style="color:var(--gray-600)">Khoa:</span><br>${esc(d.department?.name || '—')}</div>
        <div><span style="color:var(--gray-600)">Ngày gửi:</span><br>${fmtDate(d.createdAt)}</div>
        ${d.approvedAt ? `<div><span style="color:var(--gray-600)">Ngày duyệt:</span><br>${fmtDate(d.approvedAt)}</div>` : ''}
        ${/* SHA256 checksum - hidden */ ''}
        ${rejectReason ? `
        <div style="grid-column:1/-1;background:rgba(163,59,59,.08);border-radius:8px;padding:10px">
          <span style="color:var(--stamp-deny);font-weight:600">Lý do từ chối:</span><br>
          ${esc(rejectReason)}</div>` : ''}
      </div>

      ${detailUnavailable ? '<p role="status" style="color:var(--stamp-deny);font-size:.84rem">Chưa tải được thông tin hồ sơ đầy đủ. Vui lòng đóng và mở lại chi tiết để thử lại.</p>' : ''}
      ${documentMetadataHtml(d)}

      <!-- Thông tin lưu trữ pháp lý -->
      ${(d.documentType || d.valueType || d.retentionExpiry || d.reviewStatus) ? `
      <div style="margin-top:14px;padding:12px 14px;background:rgba(27,42,74,.04);
        border:1px solid var(--gray-200);border-radius:var(--radius-lg)">
        <div style="font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
          color:var(--gray-600);margin-bottom:10px">📋 Thông tin lưu trữ (TT 33/2025/TT-BYT)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.84rem">
          ${d.documentType ? `
          <div>
            <span style="color:var(--gray-600);font-size:.75rem">Loại hồ sơ:</span><br>
            <span style="font-weight:600">${esc(d.documentType?.code ? `[${d.documentType.code}] ` : '')}${esc(d.documentType?.name || '—')}</span>
          </div>` : ''}
          ${d.valueType ? `
          <div>
            <span style="color:var(--gray-600);font-size:.75rem">Mức giá trị:</span><br>
            ${d.valueType === 'permanent' || d.documentType?.isPermanent
              ? `<span class="badge badge-approved" style="font-size:.72rem">♾ Vĩnh viễn</span>`
              : `<span class="badge badge-pending"  style="font-size:.72rem">⏳ Có thời hạn</span>`}
          </div>` : ''}
          ${d.retentionExpiry ? `
          <div>
            <span style="color:var(--gray-600);font-size:.75rem">Hạn lưu trữ đến:</span><br>
            <span style="font-weight:600;color:${
              new Date(d.retentionExpiry) < new Date(Date.now() + 365*86400000)
                ? 'var(--stamp-deny)' : 'var(--navy)'
            }">${fmtDate(d.retentionExpiry)}</span>
          </div>` : ''}
          ${d.reviewStatus ? `
          <div style="grid-column:1/-1">
            <span style="color:var(--gray-600);font-size:.75rem">Trạng thái chỉnh lý:</span><br>
            ${d.reviewStatus === 'completed'
              ? `<span class="badge badge-approved" style="font-size:.72rem">✓ Đã chỉnh lý</span>`
              : `<span class="badge badge-pending" style="font-size:.72rem">⏳ Chưa chỉnh lý</span>
                 ${d.status === 'stored' ? `<button class="btn btn-ghost btn-sm" id="btn-mark-reviewed" style="margin-left:8px;font-size:.72rem">✓ Đánh dấu đã chỉnh lý</button>` : ''}`}
          </div>` : ''}
        </div>
      </div>` : ''}

      <!-- Tabs: Ghi chú / Phiên bản -->
      <div style="margin-top:20px;border-top:1px solid var(--gray-200);padding-top:16px">
        <div style="display:flex;gap:0;border-bottom:1px solid var(--gray-200);margin-bottom:12px" role="tablist">
          <button role="tab" aria-selected="true" id="tab-comments" data-tab="comments"
            style="padding:8px 16px;border:none;background:none;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--navy);border-bottom:2px solid var(--brass);margin-bottom:-1px">
            💬 Ghi chú
          </button>
          <button role="tab" aria-selected="false" id="tab-versions" data-tab="versions"
            style="padding:8px 16px;border:none;background:none;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--gray-600);border-bottom:2px solid transparent;margin-bottom:-1px">
            📋 Phiên bản
          </button>
        </div>

        <div id="panel-comments" role="tabpanel">
          <div id="comments-list" style="max-height:160px;overflow-y:auto;margin-bottom:10px">
            <div style="font-size:.8rem;color:var(--gray-400)">Đang tải…</div>
          </div>
          <div style="display:flex;gap:8px">
            <input class="form-control" type="text" id="comment-input"
              placeholder="Nhập ghi chú…" style="flex:1;font-size:.85rem" />
            <button class="btn btn-primary btn-sm" id="btn-send-comment">Gửi</button>
          </div>
        </div>

        <div id="panel-versions" role="tabpanel" style="display:none">
          <div id="versions-list" style="font-size:.8rem;color:var(--gray-400)">Đang tải phiên bản…</div>
        </div>
      </div>

      <div class="modal-actions">
        ${d.status === 'stored'
          ? `<button class="btn btn-brass" id="btn-modal-dl">↓ Tải về</button>`
          : ''}
        <button class="btn btn-ghost" data-modal-close="modal-detail">Đóng</button>
      </div>`;

    // Gắn listeners sau khi render — không dùng onclick inline
    // Tab switching
    document.querySelectorAll('#modal-detail [role="tab"]').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#modal-detail [role="tab"]').forEach(t => {
          t.setAttribute('aria-selected', 'false');
          t.style.color = 'var(--gray-600)';
          t.style.borderBottomColor = 'transparent';
        });
        tab.setAttribute('aria-selected', 'true');
        tab.style.color = 'var(--navy)';
        tab.style.borderBottomColor = 'var(--brass)';

        const target = tab.dataset.tab;
        document.querySelectorAll('#modal-detail [role="tabpanel"]').forEach(p => {
          p.style.display = 'none';
        });
        document.getElementById(`panel-${target}`).style.display = 'block';
        
        if (target === 'versions' && !document.getElementById('versions-list').dataset.loaded) {
          loadVersions(d.id);
        }
      });
    });

    document.getElementById('comment-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitComment(d.id);
    });
    document.getElementById('btn-send-comment').addEventListener('click', () => submitComment(d.id));
    document.getElementById('btn-mark-reviewed')?.addEventListener('click', async () => {
      await markAsReviewed(d.id);
    });
    document.getElementById('btn-modal-dl')?.addEventListener('click', () => {
      downloadFile(d.id, d.originalFilename || 'document');
    });
    document.querySelectorAll('#modal-detail [data-modal-close]').forEach(btn => {
      btn.onclick = () => {
        if (new URLSearchParams(window.location.search).get('return') === 'queue') {
          window.location.href = './queue.html';
          return;
        }
        Modal.close(btn.dataset.modalClose);
      };
    });

    Modal.open('modal-detail');
    loadComments(d.id);
  }

  /* ── Comments ───────────────────────────────────────────────── */
  async function markAsReviewed(docId) {
    const btn = document.getElementById('btn-mark-reviewed');
    if (!btn) return;
    btn.classList.add('loading');
    try {
      // Try different endpoints/field names
      try {
        await api.patch(`/documents/${docId}/review-status`, { status: 'completed' });
      } catch (e1) {
        try {
          await api.patch(`/documents/${docId}`, { reviewStatus: 'completed' });
        } catch (e2) {
          await api.post(`/documents/${docId}/mark-reviewed`);
        }
      }
      Toast.success('Đã đánh dấu hoàn tất chỉnh lý!');
      Modal.close('modal-detail');
      loadAll(); // Refresh data
    } catch (e) {
      Toast.error('Lỗi: ' + e.message);
      console.error('[Mark reviewed] Error:', e);
    } finally {
      btn.classList.remove('loading');
    }
  }

  async function loadVersions(docId) {
    const el = document.getElementById('versions-list');
    if (!el) return;
    el.dataset.loaded = 'true';
    el.innerHTML = '<div style="font-size:.8rem;color:var(--gray-400)">Đang tải lịch sử…</div>';
    try {
      const data = await api.get(`/documents/${docId}/versions`);
      const list = Array.isArray(data) ? data : (data.data || []);
      if (!list.length) {
        el.innerHTML = '<div style="font-size:.8rem;color:var(--gray-400)">Chỉ có 1 phiên bản.</div>';
        return;
      }
      el.innerHTML = `
        <div style="padding-left:20px">
          ${list.map((v, i) => `
            <div style="position:relative;margin-bottom:14px;padding-left:16px;
              border-left:2px solid ${i === 0 ? 'var(--brass)' : 'var(--gray-200)'}">
              <div style="position:absolute;left:-6px;top:4px;width:10px;height:10px;
                border-radius:50%;background:${i === 0 ? 'var(--brass)' : 'var(--gray-400)'}"></div>
              <div style="font-size:.82rem;font-weight:600;color:var(--navy)">
                Phiên bản ${list.length - i}
                ${i === 0 ? '<span style="color:var(--brass);font-size:.72rem">(mới nhất)</span>' : ''}
              </div>
              <div class="td-mono" style="font-size:.75rem">${esc(v.originalFilename || '—')}</div>
              <div style="font-size:.72rem;color:var(--gray-600);margin-top:2px">
                ${fmtDate(v.createdAt)} · ${fmtSize(v)}
              </div>
              ${v.status === 'stored'
                ? `<button class="btn btn-ghost btn-sm" style="margin-top:4px;font-size:.72rem"
                    data-action="dl-version" data-id="${esc(v.id)}"
                    data-name="${esc(v.originalFilename || 'document')}">↓ Tải bản này</button>`
                : ''}
            </div>`).join('')}
        </div>`;
      el.addEventListener('click', e => {
        const btn = e.target.closest('[data-action="dl-version"]');
        if (btn) downloadFile(btn.dataset.id, btn.dataset.name);
      });
    } catch (e) {
      el.innerHTML = '<div style="font-size:.78rem;color:var(--gray-400)">Chưa hỗ trợ lịch sử phiên bản.</div>';
    }
  }

  /* ── Comments ───────────────────────────────────────────────── */
  async function loadComments(docId) {
    const el = document.getElementById('comments-list');
    if (!el) return;
    try {
      const data = await api.get(`/documents/${docId}/comments`);
      const list = Array.isArray(data) ? data : (data.data || []);
      if (!list.length) {
        el.innerHTML = '<div style="font-size:.8rem;color:var(--gray-400)">Chưa có ghi chú nào.</div>';
        return;
      }
      el.innerHTML = list.map(c => `
        <div style="padding:8px 10px;background:var(--gray-100);border-radius:8px;margin-bottom:6px">
          <div style="font-size:.75rem;font-weight:600;color:var(--navy)">
            ${esc(c.author?.fullName || c.author?.email || '—')}
            <span style="color:var(--gray-400);font-weight:400">${fmtDate(c.createdAt)}</span>
          </div>
          <div style="font-size:.82rem;margin-top:3px">${esc(c.content)}</div>
        </div>`).join('');
      el.scrollTop = el.scrollHeight;
    } catch(e) {
      el.innerHTML = '<div style="font-size:.78rem;color:var(--gray-400)">Chưa hỗ trợ ghi chú.</div>';
    }
  }

  async function submitComment(docId) {
    const inp = document.getElementById('comment-input');
    const text = inp?.value.trim();
    if (!text) return;
    const btn = document.getElementById('btn-send-comment');
    btn?.classList.add('loading');
    try {
      await api.post(`/documents/${docId}/comments`, { content: text });
      inp.value = '';
      loadComments(docId);
    } catch(e) {
      Toast.error('Không gửi được: ' + e.message);
    } finally {
      btn?.classList.remove('loading');
    }
  }

  /* ── Xuất Excel ─────────────────────────────────────────────── */
  async function doExport() {
    const btn = document.getElementById('btn-export');
    btn.classList.add('loading');
    btn.disabled = true;
    
    // Timeout sau 30 giây
    const timeoutId = setTimeout(() => {
      btn.classList.remove('loading');
      btn.disabled = false;
      Toast.error('Xuất file quá lâu, vui lòng thử lại.');
    }, 30000);
    
    const params = new URLSearchParams({ format: 'xlsx' });
    const kwEl   = document.getElementById('kw-input');
    const stEl   = document.getElementById('status-filter');
    const deptEl = document.getElementById('dept-filter');
    
    const kw   = kwEl?.value.trim() || '';
    const st   = stEl?.value || '';
    const dept = deptEl?.value || '';
    
    if (kw)   params.set('keyword', kw);
    if (st)   params.set('status', st);
    if (dept) params.set('departmentId', dept);
    
    try {
      // Always use client-side export to include links
      Toast.info('Đang tạo file Excel với link...');
      await exportClientSide();
      clearTimeout(timeoutId);
      
      /* 
      // Old code - sử dụng backend export (nếu có)
      const token = Auth.getToken();
      const res = await fetch(`${API}/documents/export?${params}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      
      clearTimeout(timeoutId);
      
      if (res.status === 404) {
        // Backend chưa có endpoint export, tạo Excel phía frontend
        Toast.info('Đang tạo file Excel...');
        await exportClientSide();
        return;
      }
      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.message || `HTTP ${res.status}`);
      }
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `documents_${new Date().toISOString().slice(0,10)}.xlsx`;
      a.click();
      URL.revokeObjectURL(url);
      Toast.success('Đã xuất file Excel!');
      */
    } catch(err) {
      clearTimeout(timeoutId);
      console.error('[Export] Error:', err);
      Toast.error('Xuất thất bại: ' + err.message);
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  // Export Excel phía client (fallback khi backend chưa có)
  async function exportClientSide() {
    try {
      // Load ExcelJS từ CDN
      if (typeof ExcelJS === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js';
        document.head.appendChild(script);
        await new Promise((resolve, reject) => {
          script.onload = resolve;
          script.onerror = reject;
        });
      }

      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('Tài liệu');

      // Header
      worksheet.columns = [
        { header: 'STT', key: 'stt', width: 5 },
        { header: 'Tiêu đề', key: 'title', width: 30 },
        { header: 'Tên file', key: 'filename', width: 30 },
        { header: 'ID', key: 'id', width: 10 },
        { header: 'Link xem (copy vào browser)', key: 'link', width: 55 },
        { header: 'Khoa', key: 'dept', width: 20 },
        { header: 'Người gửi', key: 'uploader', width: 20 },
        { header: 'Trạng thái', key: 'status', width: 12 },
        { header: 'Dung lượng', key: 'size', width: 12 },
        { header: 'Ngày tải lên', key: 'date', width: 20 }
      ];

      // Style header
      worksheet.getRow(1).font = { bold: true };
      worksheet.getRow(1).fill = {
        type: 'pattern',
        pattern: 'solid',
        fgColor: { argb: 'FF1B2A4A' }
      };
      worksheet.getRow(1).font = { color: { argb: 'FFFFFFFF' }, bold: true };

      // Get current filtered docs
      const docs = _currentDocs || [];
      
      docs.forEach((d, i) => {
        const row = worksheet.addRow({
          stt: i + 1,
          title: d.title || '—',
          filename: d.originalFilename || '—',
          id: d.id ? d.id.substring(0, 8) : '—', // First 8 chars of UUID
          dept: d.department?.name || '—',
          uploader: d.uploader?.fullName || '—',
          status: d.status === 'stored' ? 'Đã lưu trữ' 
                : d.status === 'pending' ? 'Chờ duyệt' 
                : d.status === 'rejected' ? 'Từ chối' : '—',
          size: fmtSize(d),
          date: fmtDate(d.createdAt)
        });

        // Add link to "Link xem" column (download endpoint with token)
        const linkCell = row.getCell('link');
        if (d.storagePath) {
          const token = Auth.getToken();
          // Use download endpoint which may support token in URL
          linkCell.value = `${API}/documents/${d.id}/download?token=${token}`;
          linkCell.font = { color: { argb: 'FF0000FF' }, underline: true };
        } else {
          linkCell.value = '—';
        }
      });

      // Generate buffer
      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { 
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' 
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `documents_${new Date().toISOString().slice(0,10)}.xlsx`;
      a.click();
      URL.revokeObjectURL(url);
      Toast.success('Đã xuất file Excel!');
    } catch(err) {
      console.error('[Export Client] Error:', err);
      Toast.error('Lỗi tạo Excel: ' + err.message);
    }
  }

  /* ── Gán lại khoa ───────────────────────────────────────────── */
  let _assignDocId = null;

  function openAssignDept(d) {
    _assignDocId = d.id;
    document.getElementById('assign-doc-name').textContent = d.title || d.originalFilename;
    document.getElementById('assign-dept-current').textContent =
      d.department?.name ? `Khoa hiện tại: ${d.department.name}` : 'Chưa được phân khoa';

    // Load departments vào select nếu chưa có
    const sel = document.getElementById('assign-dept-select');
    if (sel.options.length <= 1) {
      api.get('/departments?limit=10000').then(res => {
        const list = Array.isArray(res) ? res : (res.data || []);
        list.forEach(dept => {
          const o = document.createElement('option');
          o.value = dept.id; o.textContent = dept.name;
          sel.appendChild(o);
        });
        if (d.department?.id) sel.value = d.department.id;
      }).catch(() => {});
    } else if (d.department?.id) {
      sel.value = d.department.id;
    }

    Modal.open('modal-assign-dept');
  }

  document.getElementById('btn-confirm-assign').addEventListener('click', async function () {
    if (!_assignDocId) return;
    const deptId = document.getElementById('assign-dept-select').value;
    if (!deptId) { Toast.warning('Vui lòng chọn khoa.'); return; }
    this.classList.add('loading');
    try {
      await api.patch(`/documents/${_assignDocId}`, { departmentId: deptId });
      Modal.close('modal-assign-dept');
      Toast.success('Đã cập nhật khoa cho tài liệu!');
      // Cập nhật inline trong bảng
      const doc = _currentDocs.find(d => d.id === _assignDocId);
      const deptName = document.getElementById('assign-dept-select').selectedOptions[0]?.text || '';
      if (doc) doc.department = { id: deptId, name: deptName };
      // Re-render row
      const row = document.querySelector(`tr[data-idx]`);
      const idx = _currentDocs.findIndex(d => d.id === _assignDocId);
      if (idx >= 0) {
        const rows = document.querySelectorAll('#results-body tr[data-idx]');
        const targetRow = [...rows].find(r => parseInt(r.dataset.idx) === idx);
        if (targetRow) {
          targetRow.cells[2].textContent = deptName;
        }
      }
      _assignDocId = null;
    } catch (err) {
      Toast.error('Gán khoa thất bại: ' + err.message);
    } finally {
      this.classList.remove('loading');
    }
  });

  /* ── Init ───────────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    loadDepartments();
    loadDocumentTypes();
    attachTableEvents(); // Attach table click handlers once
    loadAll().then(openDocumentFromUrl); // Load all docs once

    // Realtime search
    document.getElementById('kw-input').addEventListener('input', renderFiltered);
    document.getElementById('dept-filter').addEventListener('change', renderFiltered);
    [
      'adv-reference-no',
      'adv-document-number',
      'adv-issuing-unit',
      'adv-author-name',
      'adv-summary'
    ].forEach(id => document.getElementById(id)?.addEventListener('input', renderFiltered));
    document.getElementById('adv-issued-date')?.addEventListener('change', renderFiltered);
    document.getElementById('adv-received-date')?.addEventListener('change', renderFiltered);
    document.getElementById('btn-clear-advanced-search')?.addEventListener('click', resetAdvancedSearch);

    // Tab switching
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        _activeStatus = tab.dataset.status;
        renderFiltered();
      });
    });

    document.getElementById('btn-export').addEventListener('click', doExport);
  });
</script>

<script>
  /* ── Assign document type ──────────────────────────────────── */
  let _assignDoctypeDocId = null;
  
  function openAssignDoctype(d) {
    _assignDoctypeDocId = d.id;
    const name = d.title || d.originalFilename;
    document.getElementById('assign-doctype-name').textContent = name.length > 80 ? name.slice(0, 77) + '…' : name;
    document.getElementById('assign-doctype-current').textContent = d.documentType
      ? `Loại hiện tại: ${d.documentType.name}`
      : 'Chưa phân loại';
    
    // Pre-select current document type
    const sel = document.getElementById('assign-doctype-select');
    sel.value = d.documentType?.id || '';
    
    Modal.open('modal-assign-doctype');
  }

  document.getElementById('btn-confirm-assign-doctype').addEventListener('click', async function() {
    if (!_assignDoctypeDocId) return;
    const doctypeId = document.getElementById('assign-doctype-select').value;
    if (!doctypeId) { Toast.warning('Vui lòng chọn loại hồ sơ.'); return; }
    this.classList.add('loading');
    try {
      // Try PATCH /documents/:id/metadata (như queue.html dùng trước khi approve)
      await api.patch(`/documents/${_assignDoctypeDocId}/metadata`, { documentTypeId: doctypeId });
      Modal.close('modal-assign-doctype');
      Toast.success('Đã gán loại hồ sơ!');
      search(page); // Re-render
    } catch (err) {
      Toast.error('Lỗi: ' + err.message);
    } finally {
      this.classList.remove('loading');
    }
  });
</script>
