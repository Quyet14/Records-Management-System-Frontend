<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tài liệu — BV Hữu Nghị</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=interface-1" />
  <script>
    (function(){
      if(localStorage.getItem('lths_dark')==='1')
        document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>
  <style>
    .view-only-modal {
      width: min(1180px, calc(100vw - 32px));
      max-width: 1180px;
      height: min(88vh, 920px);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .view-only-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
    }
    .view-only-title {
      min-width: 0;
      font-weight: 700;
      color: var(--navy);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .view-only-body {
      flex: 1;
      overflow: auto;
      background: #2b2b2b;
      padding: 24px 14px;
    }
    .view-only-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .view-only-pages canvas {
      max-width: 100%;
      height: auto;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      user-select: none;
    }
    .view-only-message {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 28px;
      font-size: .92rem;
    }
    .request-duration-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 12px;
      align-items: start;
    }
    .document-search-card {
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid rgba(64, 126, 181, .16);
      box-shadow: 0 18px 42px rgba(27, 42, 74, .08);
    }
    .document-search-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }
    .document-search-card .search-bar {
      min-width: 0;
    }
    .document-search-card .search-bar .form-control {
      height: 54px;
      border: 1.5px solid var(--gray-200);
      border-radius: 14px;
      padding-left: 48px;
      font-size: 1rem;
      font-weight: 600;
      background: var(--white);
    }
    .document-search-card .search-icon {
      left: 16px;
      color: var(--blue);
    }
    .document-search-tip {
      margin: 8px 0 0;
      font-size: .82rem;
      color: var(--gray-600);
    }
    .document-filter-panel {
      display: none;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--gray-100);
    }
    .document-filter-panel.open {
      display: grid;
    }
    .document-filter-panel .form-label {
      margin-bottom: 7px;
      font-size: .78rem;
      letter-spacing: 0;
      color: var(--gray-700);
    }
    .document-filter-actions {
      display: flex;
      align-items: end;
      gap: 10px;
    }
    .document-filter-actions .btn {
      min-height: 46px;
      width: 100%;
      justify-content: center;
    }
    .document-results-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 4px 0 12px;
      color: var(--gray-600);
      font-size: .86rem;
    }
    .document-status-tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .document-status-tabs .filter-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1.5px solid var(--gray-300);
      border-radius: 24px;
      background: var(--white);
      color: var(--navy);
      font: inherit;
      cursor: pointer;
      transition: all .2s ease;
    }
    .document-status-tabs .filter-tab:hover,
    .document-status-tabs .filter-tab.active {
      border-color: var(--brass);
      background: rgba(156,107,46,.08);
      color: var(--brass);
    }
    .document-status-tabs .badge {
      margin-left: 2px;
    }
    #tab-count-pending {
      background: rgba(255,193,7,.15);
      color: #f59e0b;
    }
    #tab-count-stored {
      background: rgba(34,197,94,.15);
      color: #22c55e;
    }
    #tab-count-rejected {
      background: rgba(239,68,68,.15);
      color: #ef4444;
    }
    .document-search-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .document-search-actions .btn {
      min-height: 48px;
      white-space: nowrap;
    }
    @media (max-width: 1120px) {
      .document-filter-panel {
        grid-template-columns: repeat(2, minmax(160px, 1fr));
      }
    }
    @media (max-width: 720px) {
      .document-search-main,
      .document-filter-panel {
        grid-template-columns: 1fr;
      }
      .document-search-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .document-search-card {
        padding: 16px;
      }
    }
    @media (max-width: 560px) {
      .request-duration-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="../assets/js/navigation-shell.js?v=device-1"></script>
  <link rel="stylesheet" href="../assets/css/interface.css?v=3" />
</head>
<body>
<div class="app-shell">
  <nav class="sidebar"></nav>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <main class="main-content">
    <div class="page-header">
      <p class="interface-hospital-brand "><strong>BỆNH VIỆN HỮU NGHỊ</strong><span>Vietnam-HuuNghi Hospital</span></p>
        <h1 class="interface-page-title">Tra cứu tài liệu</h1>
    </div>

    <div class="card document-search-card">
      <div class="document-search-main">
        <div>
          <div class="search-bar">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="form-control" type="search" id="kw-input" placeholder="Tìm tiêu đề, tên file, khoa, loại hồ sơ, nội dung..." autocomplete="off" />
          </div>
        </div>
        <div class="document-search-actions">
          <button class="btn btn-ghost" type="button" id="btn-toggle-filters">Bộ lọc</button>
          <button class="btn btn-ghost" type="button" id="btn-clear-filters">Xóa lọc</button>
        </div>
      </div>

      <div class="document-filter-panel">
        <div>
          <label class="form-label" for="date-from-filter">Từ ngày lưu</label>
          <input class="form-control" type="date" id="date-from-filter" />
        </div>
        <div>
          <label class="form-label" for="date-to-filter">Đến ngày lưu</label>
          <input class="form-control" type="date" id="date-to-filter" />
        </div>
        <div>
          <label class="form-label" for="adv-reference-no">Số ký hiệu</label>
          <input class="form-control" type="text" id="adv-reference-no" placeholder="VD: 4058" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="adv-document-number">Số văn bản</label>
          <input class="form-control" type="text" id="adv-document-number" placeholder="VD: N31.12" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="adv-issuing-unit">Đơn vị ban hành</label>
          <input class="form-control" type="text" id="adv-issuing-unit" placeholder="VD: Bộ Y tế" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="adv-author-name">Người soạn thảo</label>
          <input class="form-control" type="text" id="adv-author-name" placeholder="Tên người soạn" autocomplete="off" />
        </div>
      </div>
    </div>

    <div class="document-status-tabs" aria-label="Lọc tài liệu theo trạng thái và phạm vi">
      <button class="filter-tab active" type="button" data-status="">
        <span>▦</span><span>Tất cả</span><span class="badge" id="tab-count-all">0</span>
      </button>
      <button class="filter-tab" type="button" data-status="pending">
        <span>◷</span><span>Chờ duyệt</span><span class="badge" id="tab-count-pending">0</span>
      </button>
      <button class="filter-tab" type="button" data-status="stored">
        <span>✓</span><span>Đã duyệt</span><span class="badge" id="tab-count-stored">0</span>
      </button>
      <button class="filter-tab" type="button" data-status="rejected">
        <span>×</span><span>Từ chối</span><span class="badge" id="tab-count-rejected">0</span>
      </button>
      <button class="filter-tab visibility-tab" type="button" data-visibility="public">
        <span>◎</span><span>Công khai</span><span class="badge visibility-tab-badge visibility-tab-badge--public" id="visibility-count-public">0</span>
      </button>
      <button class="filter-tab visibility-tab" type="button" data-visibility="department">
        <span>▤</span><span>Nội bộ</span><span class="badge visibility-tab-badge visibility-tab-badge--department" id="visibility-count-department">0</span>
      </button>
    </div>

    <div class="document-results-head">
      <div id="result-count"></div>
      <div id="active-filter-hint"></div>
    </div>
    <div id="doc-list"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-request-view">
  <div class="modal" style="max-width:520px">
    <button class="modal-close" data-modal-close="modal-request-view">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 class="modal-title">Yêu cầu xem tài liệu</h3>
    <p class="modal-subtitle" id="request-doc-title"></p>
    <div class="request-duration-grid">
      <div class="form-group">
        <label class="form-label form-label-required">Lý do cần xem *</label>
        <textarea class="form-control" id="request-reason" rows="4" placeholder="Nhập lý do phục vụ công việc..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Thời hạn đề xuất</label>

          <option value="3">3 ngày</option>

          <option value="30">30 ngày</option>
        </select>
      </div>
    </div>
    <div id="request-error" style="display:none;margin-top:-6px;margin-bottom:12px;padding:10px 12px;
      border-left:3px solid var(--stamp-deny);background:rgba(163,59,59,.08);
      color:var(--stamp-deny);border-radius:var(--radius-sm);font-size:.82rem"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-modal-close="modal-request-view">Hủy</button>
      <button class="btn btn-primary" id="btn-submit-request">Gửi yêu cầu</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-view-only">
  <div class="modal view-only-modal">
    <div class="view-only-head">
      <div class="view-only-title" id="view-only-title">Xem tài liệu</div>
      <button class="modal-close" id="view-only-close" type="button" aria-label="Đóng">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="view-only-body" id="view-only-body">
      <div class="view-only-message">Đang tải...</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-document-comments">
  <div class="modal" style="max-width:640px">
    <button class="modal-close" data-modal-close="modal-document-comments" aria-label="Đóng">×</button>
    <h2 class="modal-title">Ghi chú tài liệu</h2>
    <p class="modal-subtitle" id="document-comments-title"></p>
    <div id="document-comments-list" style="max-height:280px;overflow-y:auto;margin-bottom:16px"></div>
    <label class="form-label" for="document-comment-text">Ghi chú mới</label>
    <textarea class="form-control" id="document-comment-text" rows="3" maxlength="2000" placeholder="Nhập nội dung ghi chú…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-modal-close="modal-document-comments">Đóng</button>
      <button class="btn btn-primary" id="btn-document-comment-save">Gửi ghi chú</button>
    </div>
  </div>
</div>
<div class="toast-container"></div>
<script src="../assets/js/device-session.js?v=3"></script>
<script src="../assets/js/app.js?v=interface-1"></script>
<script src="../assets/js/sidebar.js?v=interface-1"></script>
<script>
(async () => {
  Object.assign(window, { openDocumentComments, loadDocumentComments, getCurrentUser, normalizeList, normalizeText, getDocumentId, normalizeId, isOwnDocument, normalizeViewStatus, getRequestDocumentId, normalizeRequestList, loadViewStatusesFromRequests, loadViewStatuses, loadDocs, renderFiltered, getDocumentVisibility, updateDocumentTabCounts, searchTerms, docMatchesSmartKeyword, docSearchRelevance, getAdvancedSearchFilters, toDateOnly, hasSearchFilters, renderActiveFilterHint, resetSearchFilters, toggleFilterPanel, renderTable, renderDocumentStatus, renderViewAction, renderViewAccessAction, hasDirectDepartmentViewAccess, hasApprovedViewAccess, formatViewRemaining, canShowExtend, formatDurationFromSeconds, openApprovedDocument, fetchDocumentForView, openViewOnlyModal, closeViewOnlyModal, renderViewOnlyUrl, renderViewOnlyBlob, renderPdfCanvas, openRequestModal, requestJson, createViewRequest, extendViewRequest, requestExtension });

  await Auth.require();

  let allDocs = [];
  let visibleDocs = [];
  let activeStatus = '';
  let activeVisibility = '';
  let requestingDoc = null;
  let submittingRequest = false;
  let currentViewBlobUrl = null;
  const viewStatusByDocId = new Map();
  let viewStatusesLoading = false;
  let documentLoadVersion = 0;
  const ensureSearchContent = createDocumentContentSearch(() => allDocs, renderFiltered);
  let commentDocument = null;
  let commentRequest = 0;

  async function openDocumentComments(doc) {
    if (!Auth.hasPermission('add_document_comments')) {
      Toast.warning('Bạn chưa được cấp quyền thêm ghi chú tài liệu.');
      return;
    }
    commentDocument = doc;
    document.getElementById('document-comments-title').textContent = displayDocTitle(doc);
    document.getElementById('document-comment-text').value = '';
    Modal.open('modal-document-comments');
    await loadDocumentComments(doc);
  }

  async function loadDocumentComments(doc) {
    const request = ++commentRequest;
    const target = document.getElementById('document-comments-list');
    target.textContent = 'Đang tải ghi chú…';
    try {
      const response = await api.get(`/documents/${encodeURIComponent(getDocumentId(doc))}/comments`);
      if (request !== commentRequest) return;
      const comments = normalizeList(response);
      target.innerHTML = comments.length ? comments.map(comment => `
        <div style="padding:12px 0;border-bottom:1px solid var(--gray-200)">
          <strong>${esc(comment.author?.fullName || comment.author?.email || 'Nhân viên')}</strong>
          <span style="font-size:.76rem;color:var(--gray-600)"> · ${fmtDate(comment.createdAt)}</span>
          <div class="document-text-content">${esc(comment.content || '')}</div>
        </div>`).join('') : '<p style="color:var(--gray-600)">Chưa có ghi chú.</p>';
    } catch (err) {
      if (request === commentRequest) target.textContent = 'Không tải được ghi chú: ' + err.message;
    }
  }

  document.getElementById('btn-document-comment-save').addEventListener('click', async function () {
    const doc = commentDocument;
    const input = document.getElementById('document-comment-text');
    if (!doc || !input.value.trim() || !Auth.hasPermission('add_document_comments')) return;
    this.disabled = true;
    try {
      await api.post(`/documents/${encodeURIComponent(getDocumentId(doc))}/comments`, { content: input.value.trim() });
      if (commentDocument === doc) {
        input.value = '';
        await loadDocumentComments(doc);
      }
      Toast.success('Đã thêm ghi chú.');
    } catch (err) {
      Toast.error(err.message);
    } finally {
      this.disabled = false;
    }
  });
  function getCurrentUser() {
    return Auth.getUser();
  }

  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = '../assets/js/vendor/pdf.worker.min.js';
  }

  function normalizeList(res, depth = 0) {
    if (Array.isArray(res)) return res;
    if (!res || typeof res !== 'object' || depth >= 4) return [];
    for (const key of ['records', 'data', 'documents', 'items', 'results', 'result']) {
      if (res[key] !== undefined) {
        const list = normalizeList(res[key], depth + 1);
        if (list.length || Array.isArray(res[key])) return list;
      }
    }
    return [];
  }

  function normalizeText(value = '') {
    return String(value)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  function getDocumentId(doc) {
    const id = doc?.id || doc?._id || doc?.documentId || '';
    if (typeof id === 'object' && id !== null) return id.$oid || id.toString?.() || '';
    return String(id || '');
  }

  function normalizeId(value) {
    if (!value) return '';
    if (typeof value === 'object') return value.$oid || value.toString?.() || '';
    return String(value);
  }

  function isOwnDocument(doc) {
    const currentUser = getCurrentUser();
    const myIds = [
      currentUser?.id,
      currentUser?._id,
      currentUser?.userId,
      currentUser?.sub,
    ].map(normalizeId).filter(Boolean);
    const myEmail = String(currentUser?.email || '').toLowerCase();
    const ownerFields = [
      doc?.uploader,
      doc?.uploadedBy,
      doc?.owner,
      doc?.createdBy,
      doc?.user,
      doc?.createdUser,
      doc?.author,
      doc?.uploaderInfo,
      doc?.uploadedByInfo,
      doc?.ownerInfo,
      doc?.createdUserInfo,
      doc?.documentOwner,
    ].filter(Boolean);

    const rawIdFields = [
      doc?.uploaderId,
      doc?.uploadedById,
      doc?.ownerId,
      doc?.createdById,
      doc?.createdByUserId,
      doc?.userId,
      doc?.owner_id,
      doc?.uploader_id,
      doc?.uploaded_by_id,
      doc?.created_by_id,
      doc?.created_by_user_id,
      doc?.user_id,
      ...ownerFields.flatMap(owner => {
        if (typeof owner === 'object') {
          return [
            owner.id,
            owner._id,
            owner.userId,
            owner.user_id,
            owner.sub,
            owner.ownerId,
            owner.uploaderId,
            owner.uploadedById,
          ];
        }
        return [owner];
      })
    ];
    const docUserIds = rawIdFields.map(normalizeId).filter(Boolean);

    const rawEmailFields = [
      doc?.uploaderEmail,
      doc?.uploadedByEmail,
      doc?.ownerEmail,
      doc?.createdByEmail,
      doc?.email,
      doc?.user?.email,
      doc?.uploader?.email,
      doc?.uploadedBy?.email,
      doc?.owner?.email,
      doc?.createdBy?.email,
      doc?.author?.email,
      ...ownerFields.map(owner => typeof owner === 'object' ? owner.email : owner),
    ];
    const docEmails = rawEmailFields.map(value => String(value || '').toLowerCase()).filter(Boolean);

    return docUserIds.some(id => myIds.includes(id)) || (!!myEmail && docEmails.includes(myEmail));
  }

  function normalizeViewStatus(res) {
    let data = res?.data || res || {};
    if (Array.isArray(data)) {
      data = data.find(item => ['approved', 'active'].includes(String(item?.status || '').toLowerCase()))
        || data.find(item => String(item?.status || '').toLowerCase() === 'pending')
        || data[0]
        || {};
    }

    const request = data.request || data.currentRequest || data.viewRequest || data.latestRequest || data;
    let status = request.status || request.requestStatus || request.state || data.status || data.requestStatus || data.state || 'none';
    if (data.canView === true || data.allowed === true || data.hasAccess === true || data.isApproved === true) {
      status = 'approved';
    }
    if (data.canView === false && String(status).toLowerCase() === 'approved') {
      status = 'expired';
    }

    return {
      status,
      canView: data.canView === true,
      accessSource: data.accessSource || '',
      requestId: normalizeId(request.id || request._id || request.requestId || data.id || data._id || data.requestId),
      reason: request.reason || data.reason || request.requestReason || data.requestReason || '',
      decisionNote: request.decisionNote || data.decisionNote || request.rejectReason || data.rejectReason || request.note || data.note || '',
      requestedDuration: request.requestedDuration || data.requestedDuration || request.requestedDurationDays || data.requestedDurationDays || null,
      approvedDuration: request.approvedDuration || data.approvedDuration || request.approvedDurationDays || data.approvedDurationDays || null,
      expiresAt: request.expiresAt || data.expiresAt || request.expiredAt || data.expiredAt
        || request.validUntil || data.validUntil || request.viewExpiresAt || data.viewExpiresAt
        || request.approvedUntil || data.approvedUntil || null,
      remainingText: request.remainingText || data.remainingText || request.timeRemaining || data.timeRemaining || '',
      remainingSeconds: request.remainingSeconds ?? data.remainingSeconds ?? request.remainingTimeSeconds ?? data.remainingTimeSeconds ?? null,
      remainingHours: request.remainingHours ?? data.remainingHours ?? request.remainingTimeHours ?? data.remainingTimeHours ?? null,
      canExtend: request.canExtend ?? data.canExtend ?? request.allowExtend ?? data.allowExtend
        ?? request.canRequestExtension ?? data.canRequestExtension ?? false,
      extensionRequestId: request.extensionRequestId || data.extensionRequestId || request.currentExtensionRequestId || data.currentExtensionRequestId || '',
      extensionCount: request.extensionCount ?? data.extensionCount ?? request.extendCount ?? data.extendCount ?? null,
      maxExtensions: request.maxExtensions ?? data.maxExtensions ?? request.maxExtensionCount ?? data.maxExtensionCount ?? null,
    };
  }

  function getRequestDocumentId(request) {
    const doc = request.document || request.doc || {};
    return getDocumentId(doc) || String(request.documentId || request.docId || '');
  }

  function normalizeRequestList(res) {
    return Array.isArray(res) ? res
      : Array.isArray(res?.data) ? res.data
      : Array.isArray(res?.requests) ? res.requests
      : Array.isArray(res?.items) ? res.items
      : [];
  }

  async function loadViewStatusesFromRequests(docs, target = viewStatusByDocId) {
    const endpoints = [
      '/view-requests',
      '/view-requests?status=pending',
      '/view-requests?status=approved',
      '/view-requests?status=rejected',
    ];
    const byDocId = new Map();

    for (const endpoint of endpoints) {
      try {
        const list = normalizeRequestList(await api.get(endpoint));
        list.forEach(item => {
          const docId = getRequestDocumentId(item);
          if (!docId || byDocId.has(docId)) return;
          byDocId.set(docId, normalizeViewStatus(item));
        });
      } catch (err) {
        if (!String(err.message || '').includes('404')) {
          console.warn('[View requests fallback] Failed:', { endpoint, message: err.message });
        }
      }
    }

    docs.forEach(doc => {
      const docId = getDocumentId(doc);
      target.set(docId, byDocId.get(docId) || { status: 'none' });
    });
  }

  async function loadViewStatuses(docs) {
    const statuses = new Map();
    const candidates = docs.filter(doc => {
      const immediate = getImmediateDocumentViewStatus(doc);
      if (immediate) statuses.set(getDocumentId(doc), immediate);
      return !immediate && canAccessDocumentSecurity(doc);
    });
    if (!candidates.length) return statuses;
    const first = candidates[0];
    try {
      statuses.set(getDocumentId(first), normalizeViewStatus(await api.get('/documents/' + getDocumentId(first) + '/view-status')));
    } catch (err) {
      if (String(err.message || '').includes('404')) {
        await loadViewStatusesFromRequests(candidates, statuses);
        return statuses;
      }
      statuses.set(getDocumentId(first), { status: 'none' });
    }
    const entries = await mapWithConcurrency(candidates.slice(1), async doc => {
      const id = getDocumentId(doc);
      try { return [id, normalizeViewStatus(await api.get('/documents/' + id + '/view-status'))]; }
      catch (_) { return [id, { status: 'none' }]; }
    });
    entries.forEach(([id, status]) => statuses.set(id, status));
    return statuses;
  }

  async function loadDocs() {
    const version = ++documentLoadVersion;
    await Auth.ensureFresh();
    if (version !== documentLoadVersion) return;
    document.getElementById('doc-list').innerHTML = skeletonTable(6);
    try {
      const res = await api.get('/documents/search?limit=10000');
      if (version !== documentLoadVersion) return;
      allDocs = normalizeList(res).filter(d =>
        ['pending', 'stored', 'approved', 'rejected'].includes(String(d.status || '').toLowerCase())
      );
      updateDocumentTabCounts();
      viewStatusByDocId.clear();
      viewStatusesLoading = true;
      renderFiltered();
      loadViewStatuses(allDocs.filter(d => ['stored', 'approved'].includes(String(d.status || '').toLowerCase())))
        .then(statuses => {
          if (version !== documentLoadVersion) return;
          statuses.forEach((status, id) => viewStatusByDocId.set(id, status));
          viewStatusesLoading = false;
          renderFiltered();
        }).catch(err => {
          if (version !== documentLoadVersion) return;
          viewStatusesLoading = false;
          console.warn('[View status]', err);
          renderFiltered();
        });
    } catch (err) {
      document.getElementById('doc-list').innerHTML = emptyStatePro(
        '⚠', 'Không thể tải tài liệu', esc(err.message),
        '<button class="btn btn-ghost btn-sm" id="btn-retry">Thử lại</button>'
      );
      document.getElementById('btn-retry')?.addEventListener('click', loadDocs);
      Toast.error(err.message);
    }
  }

  function renderFiltered() {
    const kw = document.getElementById('kw-input').value;
    ensureSearchContent(kw);
    const fromDate = toDateOnly(document.getElementById('date-from-filter')?.value);
    const toDate = toDateOnly(document.getElementById('date-to-filter')?.value);
    const advancedFilters = getAdvancedSearchFilters();
    visibleDocs = allDocs
      .filter(d => !activeStatus || String(d.status || '').toLowerCase() === activeStatus
        || (activeStatus === 'stored' && String(d.status || '').toLowerCase() === 'approved'))
      .filter(d => !activeVisibility || getDocumentVisibility(d) === activeVisibility)
      .filter(d => docMatchesSmartKeyword(d, kw))
      .filter(d => docMatchesAdvancedFields(d, advancedFilters))
      .filter(d => {
        const date = toDateOnly(d.approvedAt || d.createdAt || d.updatedAt);
        if (fromDate && (!date || date < fromDate)) return false;
        if (toDate && (!date || date > toDate)) return false;
        return true;
      });
    if (kw.trim()) {
      visibleDocs.sort((a, b) => docSearchRelevance(b, kw) - docSearchRelevance(a, kw));
    }
    renderActiveFilterHint();
    renderTable(visibleDocs);
  }

  function getDocumentVisibility(doc) {
    const value = normalizeText(doc.visibility || doc.accessLevel || doc.scope || doc.permission || '');
    if (['department', 'internal', 'noi bo', 'private'].includes(value)) return 'department';
    return 'public';
  }

  function updateDocumentTabCounts() {
    const counts = {
      all: allDocs.length,
      pending: allDocs.filter(doc => String(doc.status || '').toLowerCase() === 'pending').length,
      stored: allDocs.filter(doc => ['stored', 'approved'].includes(String(doc.status || '').toLowerCase())).length,
      rejected: allDocs.filter(doc => String(doc.status || '').toLowerCase() === 'rejected').length,
      public: allDocs.filter(doc => getDocumentVisibility(doc) === 'public').length,
      department: allDocs.filter(doc => getDocumentVisibility(doc) === 'department').length
    };
    document.getElementById('tab-count-all').textContent = counts.all;
    document.getElementById('tab-count-pending').textContent = counts.pending;
    document.getElementById('tab-count-stored').textContent = counts.stored;
    document.getElementById('tab-count-rejected').textContent = counts.rejected;
    document.getElementById('visibility-count-public').textContent = counts.public;
    document.getElementById('visibility-count-department').textContent = counts.department;
  }

  function searchTerms(keyword) {
    return normalizeSearchText(keyword).split(/\s+/).filter(Boolean);
  }

  function docMatchesSmartKeyword(doc, keyword) {
    const terms = searchTerms(keyword);
    if (!terms.length) return true;
    const haystack = docSearchText(doc);
    return terms.every(term => haystack.includes(term));
  }

  function docSearchRelevance(doc, keyword) {
    const terms = searchTerms(keyword);
    if (!terms.length) return 0;
    const title = normalizeSearchText(displayDocTitle(doc));
    const filename = normalizeSearchText(displayDocFilename(doc));
    const type = normalizeSearchText(doc.documentType?.name || doc.documentType?.code || '');
    const dept = normalizeSearchText(doc.department?.name || doc.department?.code || '');
    const metadata = normalizeSearchText([
      doc.referenceNo,
      doc.documentNumber,
      doc.issuingUnit,
      doc.authorName,
      doc.summary,
      doc.description,
      doc.originalFilename
    ].filter(Boolean).join(' '));
    const full = docSearchText(doc);
    const phrase = normalizeSearchText(keyword);

    let score = 0;
    if (title === phrase || filename === phrase) score += 80;
    if (title.includes(phrase)) score += 45;
    if (filename.includes(phrase)) score += 40;
    if (type.includes(phrase)) score += 24;
    if (dept.includes(phrase)) score += 20;
    if (metadata.includes(phrase)) score += 18;

    terms.forEach(term => {
      if (title.includes(term)) score += 12;
      if (filename.includes(term)) score += 10;
      if (metadata.includes(term)) score += 7;
      if (type.includes(term) || dept.includes(term)) score += 5;
      if (full.includes(term)) score += 1;
    });
    return score;
  }

      documentNumber: document.getElementById('adv-document-number')?.value || '',

  function renderDocumentStatus(doc) {

  function renderViewAction(doc, idx) {
    if (!canAccessDocumentSecurity(doc)) {
      return '<span style="font-size:.76rem;color:var(--gray-600)">Không được truy cập ở độ mật này</span>';
    }
    const actions = [renderViewAccessAction(doc, idx)];
    if (Auth.hasPermission('download_documents') && hasApprovedViewAccess(doc)
      && ['approved', 'stored'].includes(String(doc.status || '').toLowerCase())) {
      actions.push(`<button class="btn btn-ghost btn-sm" data-action="download" data-idx="${idx}">↓ Tải về</button>`);
    }
    if (Auth.hasPermission('add_document_comments')) {
      actions.push(`<button class="btn btn-ghost btn-sm" data-action="comments" data-idx="${idx}">Ghi chú</button>`);
    }
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${actions.join('')}</div>`;
  }

  function renderViewAccessAction(doc, idx) {
    if (!canAccessDocumentSecurity(doc)) return '<span>Không được truy cập ở độ mật này</span>';
    if (String(doc?.status || '').toLowerCase() === 'pending') {
      return '<span style="font-size:.76rem;color:var(--gray-600)">Chỉ xem được sau khi duyệt</span>';
    }
    if (isOwnDocument(doc)) {
      return `
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
          <span style="font-size:.76rem;color:var(--stamp-ok);font-weight:600">Tài liệu của bạn</span>
          <button class="btn btn-brass btn-sm" data-action="view" data-idx="${idx}">Xem tài liệu</button>
        </div>`;
    }

    const docId = getDocumentId(doc);
    const status = viewStatusByDocId.get(docId) || { status: 'none' };
    const st = String(status.status || 'none').toLowerCase();
    const expired = status.expiresAt && new Date(status.expiresAt) <= new Date();

    if (hasApprovedViewAccess(doc)) {
      const directDepartmentAccess = hasDirectDepartmentViewAccess(doc);
      const remaining = directDepartmentAccess ? 'Được xem trực tiếp theo quyền trong khoa' : formatViewRemaining(status);
      const extend = !directDepartmentAccess && canShowExtend(status)
        ? `<button class="btn btn-ghost btn-sm" data-action="extend" data-idx="${idx}">Xin gia hạn</button>`
        : '';
      return `
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
          <span style="font-size:.76rem;color:var(--stamp-ok);font-weight:600">${esc(remaining)}</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-brass btn-sm" data-action="view" data-idx="${idx}">Xem tài liệu</button>
            ${extend}
          </div>
        </div>`;
    }
    if (viewStatusesLoading && !viewStatusByDocId.has(docId)) return '<span>Đang kiểm tra quyền xem…</span>';
    if (st === 'pending') {
      return '<span class="badge badge-pending">Đang chờ duyệt</span>';
    }
    if (!Auth.hasPermission('request_document_view')) {
      return '<span style="font-size:.76rem;color:var(--gray-600)">Chưa được cấp quyền xem tài liệu này</span>';
    }
    if (st === 'rejected' || st === 'expired' || expired) {
      const note = status.decisionNote || (expired ? 'Quyền xem đã hết hạn.' : 'Yêu cầu đã bị từ chối.');
      return `
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
          <span style="font-size:.76rem;color:var(--stamp-deny);max-width:260px">${esc(note)}</span>
          <button class="btn btn-ghost btn-sm" data-action="request" data-idx="${idx}">Gửi lại yêu cầu</button>
        </div>`;
    }
    return `<button class="btn btn-primary btn-sm" data-action="request" data-idx="${idx}">Yêu cầu xem</button>`;
  }

  function hasDirectDepartmentViewAccess(doc) {
    if (!canAccessDocumentSecurity(doc)) return false;
    const user = Auth.getUser();
    const userDepartmentId = String(user?.departmentId || user?.department?.id || '');
    const documentDepartmentId = String(doc?.departmentId || doc?.department?.id || '');
    return user?.role === 'user'
      && !!userDepartmentId && userDepartmentId === documentDepartmentId
      && ['department', 'public'].includes(String(doc?.visibility || '').toLowerCase())
      && ['stored', 'approved'].includes(String(doc?.status || '').toLowerCase())
      && (Auth.hasPermission('view_department_documents') || Auth.hasPermission('request_document_view'));
  }

  function hasApprovedViewAccess(doc) {
    if (!canAccessDocumentSecurity(doc)) return false;
    if (isOwnDocument(doc)) return true;
    if (hasDirectDepartmentViewAccess(doc)) return true;
    const docId = getDocumentId(doc);
    const status = viewStatusByDocId.get(docId) || { status: 'none' };
    const st = String(status.status || 'none').toLowerCase();
    const expired = status.expiresAt && new Date(status.expiresAt) <= new Date();
    if (!['approved', 'active'].includes(st) || expired) return false;
    if (status.canView === true || ['department_permission', 'document_review'].includes(status.accessSource)) return true;

    return !!(
      status.requestId ||
      status.reason ||
      status.expiresAt ||
      status.approvedDuration ||
      status.remainingText ||
      status.remainingSeconds != null ||
      status.remainingHours != null
    );
  }

  function formatViewRemaining(status) {
    if (status.accessSource === 'department_permission') return 'Được xem theo quyền nội bộ khoa';
    if (status.remainingText) return `Còn hạn xem: ${status.remainingText}`;
    if (status.remainingSeconds != null) {
      const seconds = Number(status.remainingSeconds);
      if (Number.isFinite(seconds)) return `Còn hạn xem: ${formatDurationFromSeconds(seconds)}`;
    }
    if (status.remainingHours != null) {
      const hours = Number(status.remainingHours);
      if (Number.isFinite(hours)) return `Còn hạn xem: ${formatDurationFromSeconds(hours * 3600)}`;
    }
    if (status.expiresAt) return `Hạn xem đến: ${fmtDate(status.expiresAt)}`;
    if (status.approvedDuration) return `Thời hạn xem: ${status.approvedDuration} ngày`;
    return 'Đang còn hạn xem';
  }

  function canShowExtend(status) {
    if (!Auth.hasPermission('request_document_view')) return false;
    if (!status?.canExtend || !status.requestId) return false;
    if (status.maxExtensions != null && status.extensionCount != null) {
      return Number(status.extensionCount) < Number(status.maxExtensions);
    }
    return true;
  }

  function formatDurationFromSeconds(seconds) {
    if (seconds <= 0) return 'sắp hết hạn';
    const days = Math.floor(seconds / 86400);
    const hours = Math.ceil((seconds % 86400) / 3600);
    if (days > 0) return hours > 0 ? `${days} ngày ${hours} giờ` : `${days} ngày`;
    return `${Math.max(1, hours)} giờ`;
  }

  async function openApprovedDocument(doc) {

      if (!docId) throw new Error('Không xác định được mã tài liệu.');

      closeViewOnlyModal();
      Toast.error('Không thể mở tài liệu: ' + err.message);
    }

  async function renderViewOnlyUrl(viewUrl, token, doc) {
    const res = await window.fetch(new URL(viewUrl, API).href, { credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' });
    if (!res.ok) throw apiError(res, await res.json().catch(() => ({})));
    await renderViewOnlyBlob(await res.blob(), doc);
  }

  async function renderViewOnlyBlob(blob, doc) {
    const filename = doc.originalFilename || doc.title || '';
    const type = (blob.type || '').toLowerCase();
    const isPdf = type.includes('pdf') || /\.pdf($|\?)/i.test(filename);
    const isImage = type.startsWith('image/') || /\.(png|jpe?g|gif|webp)$/i.test(filename);

    if (isPdf) {
      await renderPdfCanvas(blob);
      return;
    }

    if (isImage) {
      if (currentViewBlobUrl) URL.revokeObjectURL(currentViewBlobUrl);
      currentViewBlobUrl = URL.createObjectURL(blob);
      document.getElementById('view-only-body').innerHTML = `
        <div class="view-only-message">
          <img src="${currentViewBlobUrl}" alt="${esc(filename || 'Tài liệu')}"
            style="max-width:100%;max-height:100%;object-fit:contain;background:#fff" />
        </div>`;
      return;
    }

    document.getElementById('view-only-body').innerHTML =
      '<div class="view-only-message">Định dạng này chưa hỗ trợ xem trực tiếp. Vui lòng liên hệ quản trị viên nếu cần truy cập nội dung.</div>';
  }

  async function renderPdfCanvas(blob) {
    await ensurePdfJsLoaded();

    const body = document.getElementById('view-only-body');
    body.innerHTML = '<div class="view-only-pages" id="view-only-pages"></div>';
    const pagesEl = document.getElementById('view-only-pages');
    const data = await blob.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    const maxWidth = Math.min(1040, Math.max(320, body.clientWidth - 42));

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = Math.min(1.6, maxWidth / baseViewport.width);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.setAttribute('aria-label', `Trang ${pageNum}`);
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      pagesEl.appendChild(canvas);
      await page.render({ canvasContext: context, viewport }).promise;
    }
  }

  async function requestJson(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    const token = Auth.getToken();
    if (token) headers.Authorization = `Bearer ${token}`;

    const res = await Auth.fetch(API + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.message || data.error || `HTTP ${res.status}`);
      err.status = res.status;
      err.details = data;
      throw err;
    }
    return data;
  }

  async function createViewRequest(docId, reason, requestedDuration) {
    if (!docId) throw new Error('Không xác định được mã tài liệu.');
    return requestJson('POST', `/documents/${docId}/view-requests`, { reason, requestedDuration });
  }

  async function extendViewRequest(requestId) {
    if (!requestId) throw new Error('Không xác định được mã yêu cầu xem.');
    return requestJson('POST', `/view-requests/${requestId}/extend`);
  }

  document.getElementById('doc-list').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const doc = visibleDocs[parseInt(btn.dataset.idx, 10)];
    if (!doc) return;
    if (btn.dataset.action === 'view') openApprovedDocument(doc);
    if (btn.dataset.action === 'request') openRequestModal(doc);
    if (btn.dataset.action === 'comments') openDocumentComments(doc);
    if (btn.dataset.action === 'download' && Auth.hasPermission('download_documents') && hasApprovedViewAccess(doc)) {
      api.download(`/documents/${encodeURIComponent(getDocumentId(doc))}/download`, displayDocFilename(doc));
    }
    if (btn.dataset.action === 'extend') {
      const status = viewStatusByDocId.get(getDocumentId(doc));
      requestExtension(status, btn);
    }
  });

  async function requestExtension(status, btn) {
    if (!Auth.hasPermission('request_document_view')) {
      Toast.warning('Bạn chưa được cấp quyền gửi yêu cầu xem tài liệu.');
      return;
    }
    if (!status?.requestId) {
      Toast.warning('Không xác định được yêu cầu xem hiện tại.');
      return;
    }
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await extendViewRequest(status.requestId);
      Toast.success('Đã gửi yêu cầu gia hạn.');
      await loadDocs();
    } catch (err) {
      Toast.error(err.message || 'Không thể gửi yêu cầu gia hạn.');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  document.getElementById('btn-submit-request').addEventListener('click', async function () {
    if (!requestingDoc || submittingRequest) return;
    const reason = document.getElementById('request-reason').value.trim();
    if (!reason) {
      Toast.warning('Vui lòng nhập lý do cần xem tài liệu.');
      return;
    }
    const requestedDuration = Number(document.getElementById('request-duration').value);
    submittingRequest = true;
    this.disabled = true;
    this.classList.add('loading');
    try {
      const docId = getDocumentId(requestingDoc);
      await createViewRequest(docId, reason, requestedDuration);
      viewStatusByDocId.set(docId, { status: 'pending', reason, requestedDuration });
      Modal.close('modal-request-view');
      renderTable(visibleDocs);
      Toast.success('Đã gửi yêu cầu xem tài liệu.');
    } catch (err) {
      const errorBox = document.getElementById('request-error');
      console.error('[View request] Failed:', {
        document: requestingDoc,
        documentId: getDocumentId(requestingDoc),
        endpoint: `/documents/${getDocumentId(requestingDoc)}/view-requests`,
        reason,
        status: err.status,
        details: err.details,
        message: err.message,
      });
      errorBox.textContent = err.status >= 500
        ? `Backend trả lỗi 500 khi tạo yêu cầu. Endpoint đã gọi: /documents/${getDocumentId(requestingDoc)}/view-requests.`
        : (err.message || 'Không gửi được yêu cầu.');
      errorBox.style.display = 'block';
    } finally {
      submittingRequest = false;
      this.disabled = false;
      this.classList.remove('loading');
    }
  });

  onPageReady(async () => {
    await Auth.ensureFresh();
    renderBreadcrumb([{ label: 'Trang chủ', href: 'dashboard.html' }, { label: 'Tài liệu' }]);
    const debouncedRender = debounce(renderFiltered, 250);
    document.querySelectorAll('.document-status-tabs [data-status]').forEach(button => {
      button.addEventListener('click', () => {
        activeStatus = button.dataset.status || '';
        activeVisibility = '';
        document.querySelectorAll('.document-status-tabs .visibility-tab').forEach(tab => {
          tab.classList.remove('active');
        });
        document.querySelectorAll('.document-status-tabs [data-status]').forEach(tab => {
          tab.classList.toggle('active', tab === button);
        });
        renderFiltered();
      });
    });
    document.querySelectorAll('.document-status-tabs .visibility-tab').forEach(button => {
      button.addEventListener('click', () => {
        activeVisibility = button.dataset.visibility;
        activeStatus = '';
        document.querySelectorAll('.document-status-tabs [data-status]').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.status === '');
        });
        document.querySelectorAll('.document-status-tabs .visibility-tab').forEach(tab => {
          tab.classList.toggle('active', tab === button);
        });
        renderFiltered();
      });
    });
    document.getElementById('kw-input').addEventListener('input', debouncedRender);
    ['adv-reference-no', 'adv-document-number', 'adv-issuing-unit', 'adv-author-name'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', debouncedRender);
    });
    ['date-from-filter', 'date-to-filter'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', renderFiltered);
    });
    document.getElementById('btn-toggle-filters')?.addEventListener('click', toggleFilterPanel);
    document.getElementById('btn-clear-filters')?.addEventListener('click', resetSearchFilters);
    renderActiveFilterHint();
    loadDocs();
  });

})().catch(Auth.showError);
</script>
<script src="../assets/js/interface.js?v=2" defer></script>
</body>
