<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Đặt lại mật khẩu</title><link rel="stylesheet" href="../assets/css/style.css?v=auth3" /><link rel="stylesheet" href="../assets/css/auth-pages.css?v=3" /></head>
<body class="auth-page"><main class="auth-wrap"><section class="auth-art"><img class="auth-stamp" src="../assets/images/logo.png" alt="Logo Bệnh viện Hữu Nghị" /><h1>BỆNH VIỆN HỮU NGHỊ<br>Hệ thống lưu trữ tài liệu</h1><p>Vietnam-HuuNghi Hospital<br>Document Archive System</p><div class="auth-lines"><div class="auth-line"></div><div class="auth-line"></div><div class="auth-line"></div></div></section><section class="auth-panel"><h2>Đặt lại mật khẩu</h2><p class="sub">Tạo mật khẩu mới cho tài khoản của bạn.</p><div class="auth-error" id="error"></div><form id="form"><div class="form-group"><label class="form-label">Mật khẩu mới</label><input class="form-control" id="password" type="password" minlength="6" required autocomplete="new-password" /></div><div class="form-group"><label class="form-label">Xác nhận mật khẩu</label><input class="form-control" id="confirm" type="password" minlength="6" required autocomplete="new-password" /></div><button class="btn btn-primary auth-btn" id="submit" type="submit">Lưu mật khẩu</button></form></section></main>
<script src="../assets/js/app.js?v=fast-loading-24"></script><script src="../assets/js/auth-flow.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value,b=document.getElementById('submit'),x=document.getElementById('error');x.style.display='none';if(p.length<6||p!==c){x.textContent=p!==c?'Mật khẩu xác nhận không khớp.':'Mật khẩu tối thiểu 6 ký tự.';x.style.display='block';return}b.disabled=true;b.classList.add('loading');try{await api.post('/auth/reset-password',{reset_token:sessionStorage.getItem('lths_reset_token'),new_password:p,confirm_password:c});sessionStorage.removeItem('lths_reset_token');sessionStorage.removeItem('lths_reset_email');alert('Đặt lại mật khẩu thành công.');location.href='login.html';}catch(err){x.textContent=authErrorMessage(err);x.style.display='block';b.disabled=false;b.classList.remove('loading');}});</script></body></html>
