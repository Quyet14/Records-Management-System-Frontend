<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Nhập mã OTP</title><link rel="stylesheet" href="../assets/css/style.css?v=auth3" /><link rel="stylesheet" href="../assets/css/auth-pages.css?v=3" /></head>
<body class="auth-page"><main class="auth-wrap"><section class="auth-art"><img class="auth-stamp" src="../assets/images/logo.png" alt="Logo Bệnh viện Hữu Nghị" /><h1>BỆNH VIỆN HỮU NGHỊ<br>Hệ thống lưu trữ tài liệu</h1><p>Vietnam-HuuNghi Hospital<br>Document Archive System</p><div class="auth-lines"><div class="auth-line"></div><div class="auth-line"></div><div class="auth-line"></div></div></section><section class="auth-panel"><h2>Nhập mã OTP</h2><p class="sub">Mã đã được gửi đến email của bạn.</p><div class="auth-error" id="error"></div><form id="form"><div class="auth-otp-group"><input class="auth-otp" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-otp="0" required /><input class="auth-otp" maxlength="1" inputmode="numeric" data-otp="1" required /><input class="auth-otp" maxlength="1" inputmode="numeric" data-otp="2" required /><input class="auth-otp" maxlength="1" inputmode="numeric" data-otp="3" required /><input class="auth-otp" maxlength="1" inputmode="numeric" data-otp="4" required /><input class="auth-otp" maxlength="1" inputmode="numeric" data-otp="5" required /></div><button class="btn btn-primary auth-btn" id="submit" type="submit">Xác thực</button></form><a class="auth-link" href="forgot-password.html">Quay lại</a></section></main>
<script src="../assets/js/app.js?v=fast-loading-24"></script><script src="../assets/js/auth-flow.js"></script><script>const inputs=[...document.querySelectorAll('[data-otp]')];inputs.forEach((input,index)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(-1);if(input.value&&index<inputs.length-1)inputs[index+1].focus();});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&index>0)inputs[index-1].focus();});input.addEventListener('paste',e=>{e.preventDefault();const value=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);value.split('').forEach((char,i)=>{if(inputs[i])inputs[i].value=char;});if(value)inputs[Math.min(value.length,6)-1].focus();});});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),x=document.getElementById('error'),otp=inputs.map(input=>input.value).join('');x.style.display='none';if(otp.length!==6){x.textContent='Vui lòng nhập đủ 6 số OTP.';x.style.display='block';return}b.disabled=true;b.classList.add('loading');try{const res=await api.post('/auth/reset-password/verify-otp',{email:sessionStorage.getItem('lths_reset_email'),otp});if(!res.reset_token)throw new Error('Không nhận được mã đặt lại mật khẩu.');sessionStorage.setItem('lths_reset_token',res.reset_token);location.href='reset-password.html';}catch(err){x.textContent=authErrorMessage(err);x.style.display='block';b.disabled=false;b.classList.remove('loading');}});</script></body></html>
